    question: "How does SecurePay fit with our existing acquirer?"
    answer: "SecurePay is designed to work with your preferred acquirer or payment service provider. Your acquirer processes and settles funds directly to your account."
    link_label: "See Gateway & APIs →"
    url: "/services/#gateway-api"

