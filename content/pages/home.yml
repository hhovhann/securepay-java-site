services:
  eyebrow: "SERVICES"
  title: "Our Services"
  text: "Our broad range of services take hotel operations to a new level, all whilst reducing manual activity through intelligent automations."
  cards:
    - number: "01"
      icon: "↗︎"
      title: "Payment Links"
      text: "Branded guest messaging, with secure payment links for bookings and other services. Automated creation and PMS postings, via API."
      link_label: "Payment Links →"
      url: "/services/#payment-links"
    - number: "02"
      icon: "✳︎"
      title: "SmartSell Promotions"
      text: "Drive bookings and payments effortlessly with our customised branded landing pages. Perfect for promotions, F&B, events and more."
      link_label: "SmartSell Promotions →"
      url: "/services/#smartsell"
    - number: "03"
      icon: "⌘"
      title: "Gateway & APIs"
      text: "APIs for 3rd party apps to take 3DS payments, send bookings, create payment links, and receive payment posting notifications."
      link_label: "Gateway & APIs →"
      url: "/services/#gateway-api"
    - number: "04"
      icon: "◉"
      title: "Revenue Assurance"
      text: "Chargeback / fraud avoidance and defence functionality and services. Reconciliation of fund settlements and channel commissions."
      link_label: "Revenue Assurance →"
      url: "/services/#revenue-assurance"

benefits:
  eyebrow: "BENEFITS"
  title: "Our Benefits"
  cards:
    - label: "01 / BOOKINGS"
      title: "Less Work – Bookings"
      text: "Reduce work, through automated booking handling, sending customised payment link messages, in line with booking policies:"
      points:
        - "Validate bookings with advance payments"
        - "Automated follow up workflows"
        - "Post payments to the PMS via API"
    - label: "02 / OCCUPANCY"
      title: "Higher Occupancy"
      text: "Improved occupancy and room inventory control, identifying fake booking, likely no-shows and late cancellations early:"
      points:
        - "Identify (wash) of bookers unlikely to stay"
        - "Find unpaid bookings to cancel"
        - "Resell available inventory fast"
    - label: "03 / COLLECTION"
      title: "More Payments"
      text: "Achieve significantly higher levels of 3D Secure payments, with messaging via email, SMS and WhatsApp:"
      points:
        - "Automated reminders"
        - "Reduce unnecessary payment declines"
        - "Local payments methods supported"
    - label: "04 / F&B & EVENTS"
      title: "Less Work – F&B / Event"
      text: "Ease the work of getting booking and payments for F&B outlets, events and promotions, whilst maximising booking revenues:"
      points:
        - "Customised landing pages with payments"
        - "Simple payment gateway for 3rd party F&B booking apps to allow immediate payment"
    - label: "05 / ACQUIRER CHOICE"
      title: "Acquirer Independent"
      text: "Process transactions through your preferred card acquirer and payment gateway, maintaining long-term flexibility:"
      points:
        - "Multiple acquirer options to choose from"
        - "Comply with your payment gateway strategy"
        - "Funds settled into your account by your acquirer"
    - label: "06 / REVENUE"
      title: "Zero Fraud, Chargebacks"
      text: "SecurePay provides advanced revenue assurance features and services, to eradicate chargeback and fraud losses:"
      points:
        - "Avoid charging cards manually"
        - "Successfully defend against disputes"
        - "Reconcile payments with acquirer settlements"

about:
  eyebrow: "ABOUT US"
  title: "Born in the UAE"
  text: "Headquartered in Dubai, UAE, we focus only on hospitality, and strive to meet the individual requirements of our customers. Since 2016, we have grown to provide services to most major global hotel operating companies, along with leading independent luxury hotels. We count among our customers a full range of 3 to 7 star properties."
  button:
    label: "About Us"
    url: "/about-us/"
  items:
    - number: "01"
      title: "Global"
      text: "SecurePay operates globally through a network of payment gateways, complementing hotel operators’ approved payment strategies."
    - number: "02"
      title: "Independent"
      text: "SecurePay is independent and processes transactions through a hotels preferred acquirer or Payment Service Provider (PSP)."
    - number: "03"
      title: "Evolving"
      text: "Our services never remain static. We are constantly adding new capabilities in responses to our customers evolving needs."
    - number: "04"
      title: "Great Service"
      text: "At SecurePay we are committed to the delivery of the very best levels of customer support to both you and your guests."
    - number: "05"
      title: "Secure/Available"
      text: "Our services are delivered within a high security / high availability architecture utilising the very best in cloud technologies."
    - number: "06"
      title: "Privacy / PCI-DSS"
      text: "We ensure that your PCI and privacy legislation requirements are maintained, through our own compliance."

workflow:
  eyebrow: "EXPLORE A SECUREPAY WORKFLOW"
  title: "From booking request\nto payment response."
  text: "Select a step to see how SecurePay describes the connected workflow. Integrations and policies vary by hotel."
  steps_label: "Payment workflow steps"
  # "step" must match a stage in hero.workflow.stages. "detail_title" and "detail" are shown when the step is selected.
  steps:
    - step: "booking"
      number: "01"
      title: "Booking arrives"
      text: "PMS API, OTA integration or manual entry"
      detail_title: "01 · Booking arrives"
      detail: "Bookings can be collected through a PMS API, OTA integration or manual creation. The Booking Automation API can receive new, cancelled and modified bookings and trigger payment requests based on hotel policies."
    - step: "request"
      number: "02"
      title: "Request is sent"
      text: "Branded message and reminders"
      detail_title: "02 · A payment request is sent"
      detail: "Branded payment or pre-authorisation requests can be sent by email, SMS or WhatsApp. Booking workflows can use hotel templates and request/reminder workflows, including handling for advance-purchase and flexible bookings."
    - step: "payment"
      number: "03"
      title: "Guest pays"
      text: "Secure link and 3D Secure"
      detail_title: "03 · The guest pays"
      detail: "A payment link leads to a secure payment page and gateway. SecurePay describes 3D Secure Gateway API payments and SmartSell promotion pages with 3D Secure payments. The hotel can work with its chosen acquirer or PSP."
    - step: "response"
      number: "04"
      title: "Response & reconcile"
      text: "API response, PMS posting, PayMatch"
      detail_title: "04 · Payment response and reconciliation"
      detail: "Successful payment responses can be sent through APIs and payments can be posted to a PMS via API. SecurePay’s PayMatch solution reconciles PMS and settlement statements, expected/actual cash deposits and channel commissions."
  note: "This is an explanatory example based on SecurePay’s published descriptions, not a guarantee of one standard integration for every hotel."

guide_promo:
  eyebrow: "QUESTIONS, MEET CLEAR ANSWERS"
  title: "Get to know SecurePay,\none good question at a time."
  text: "Ask about payment links, hotel workflows, integrations or partnerships. The SecurePay Guide points you to the source material behind every answer."
  button_label: "Ask the SecurePay Guide"
