# Home page — https://public.securepay.ae/
# Formatting: new line = line break, [label](url) = link, ==text== = teal accent. See CLAUDE.md.

seo:
  title: "SecurePay | Hotel Payment Links, Automation & Gateway"
  description: "Payment software built for hotels since 2016. Automated payment links, 3D Secure collection, PMS posting and chargeback defence, with your own acquirer."

hero:
  eyebrow: "GAME CHANGING PAYMENTS FOR HOTELS"
  title: "Get paid.\n==Smarter.=="
  text: "Enable payments, validate bookings, enhance promotions, and ensure revenue security. Since 2016, we’ve been helping our hotel partners boost revenues and reduce costs. Our solutions empower hotels to collaborate seamlessly with their preferred card acquirer or payment service provider and guests. Globally."
  primary_button:
    label: "Want a Demo? Contact us"
    url: "/contact-us/"
  secondary_button:
    label: "Our Services"
    url: "/services/"
  workflow:
    label: "Explanatory hotel payment workflow; select a stage for details"
    centre: "SP"
    centre_caption: "HOTEL PAYMENT\nWORKFLOWS"
    stages:
      - step: "booking"
        label: "01 / BOOKING"
        title: "Reservation received"
        icon: "↗︎"
      - step: "request"
        label: "02 / REQUEST"
        title: "Branded request\n& reminders"
        icon: "↗︎"
      - step: "payment"
        label: "03 / PAYMENT"
        title: "Guest pays\nby secure link"
        icon: "✓"
      - step: "response"
        label: "04 / RESPONSE"
        title: "API response\n& PMS posting"
        icon: "↗︎"
    caption: "Explanatory example · hotel setup varies"
    caption_link: "Explore all four stages ↘︎"

