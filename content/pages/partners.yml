# Partners — https://public.securepay.ae/partners/
# Formatting: new line = line break, [label](url) = link, ==text== = teal accent. See CLAUDE.md.
# The form is SecurePay's existing HubSpot form. Do not change the HubSpot IDs without IT.

seo:
  title: "Partners | SecurePay"
  description: "Partner with SecurePay. We work with companies providing complementary solutions and services to the global hospitality market."

intro:
  eyebrow: "PARTNERS"
  title: "Partner Lounge"
  text: "We welcome partnership enquiries from like-minded companies who provide complimentary solutions or services to the global hospitality market."

image:
  src: "/assets/img/pages/partners.png"
  alt: "Black-and-white image from SecurePay’s original partners page"

categories:
  eyebrow: "PARTNERSHIP CATEGORIES"
  title: "Partnership Categories"
  text: "Potential partners may wish to pursue solutions integration to deliver a broader, cohesive hospitality offering and explore co-selling opportunities, or may be leading global acquirers or PSPs."
  cards:
    - label: "01"
      title: "Payment Services"
      text: "We integrate with multiple leading payment gateway vendors, with regional or global reach, already serving many hospitality clients. SecurePay’s services would enhance overall service offerings."
    - label: "02"
      title: "Integrated Solutions"
      text: "Use our API connectors to enhance payment your system’s capabilities. This eases complex payment gateway integration, especially in markets where local integrations are necessary."
    - label: "03"
      title: "Acquirers / PSPs"
      text: "We already work with a large number of acquirers in different markets (often informally). Working with SecurePay can provide high levels of ‘stickiness’ for your hospitality merchants."

enquiry:
  eyebrow: "START A PARTNERSHIP ENQUIRY"
  text: "Please complete the form below, email us on [partnerships@securepay.ae](mailto:partnerships@securepay.ae) or call us on +971 50 478 0251 or +971 56 790 0854."

