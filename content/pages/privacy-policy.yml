# Privacy Policy — https://public.securepay.ae/privacy-policy/
# Legal text: change only with wording approved by SecurePay. Formatting: see CLAUDE.md.

seo:
  title: "Privacy Policy | SecurePay"
  description: "How SecurePay collects, uses and protects personal data on this website, and how to contact us about your privacy."

intro:
  eyebrow: "PRIVACY POLICY"
  title: "Your data is ==safe with us=="

image:
  src: "/assets/img/pages/privacy-policy.png"
  alt: "Black-and-white image from SecurePay’s original privacy policy page"

sections:
  - title: "Who we are"
    paragraphs:
      - "This website is published by Exhilarant Technologies FZE (trading as “SecurePay”), a company incorporated under the regulations of the Emirate of Dubai United Arab Emirates, with registered office at DTEC, Silicon Oasis, Dubai UAE."
  - title: "Comments"
    paragraphs:
      - "When visitors leave comments on the site we collect the data shown in the comments form, and also the visitor’s IP address and browser user agent string to help spam detection."
  - title: "Cookies"
    paragraphs:
      - "If you leave a comment on our site you may opt-in to saving your name, email address and website in cookies. These are for your convenience so that you do not have to fill in your details again when you leave another comment. These cookies will last for one year. If you visit our login page, we will set a temporary cookie to determine if your browser accepts cookies. This cookie contains no personal data and is discarded when you close your browser. When you log in, we will also set up several cookies to save your login information and your screen display choices. Login cookies last for two days, and screen options cookies last for a year. If you select “Remember Me”, your login will persist for two weeks. If you log out of your account, the login cookies will be removed. If you edit or publish an article, an additional cookie will be saved in your browser. This cookie includes no personal data and simply indicates the post ID of the article you just edited. It expires after 1 day."
  - title: "Embedded content from other websites"
    paragraphs:
      - "Articles on this site may include embedded content (e.g. videos, images, articles, etc.). Embedded content from other websites behaves in the exact same way as if the visitor has visited the other website."
      - "These websites may collect data about you, use cookies, embed additional third-party tracking, and monitor your interaction with that embedded content, including tracking your interaction with the embedded content if you have an account and are logged in to that website."
  - title: "Who we share your data with"
    paragraphs:
      - "No one."
  - title: "How long we retain your data"
    paragraphs:
      - "If you leave a comment, the comment and its metadata are retained indefinitely. This is so we can recognise and approve any follow-up comments automatically instead of holding them in a moderation queue. For users that register on our website (if any), we also store the personal information they provide in their user profile. All users can see, edit, or delete their personal information at any time (except they cannot change their username). Website administrators can also see and edit that information."
  - title: "What rights you have over your data"
    paragraphs:
      - "If you have an account on this site, or have left comments, you can request to receive an exported file of the personal data we hold about you, including any data you have provided to us. You can also request that we erase any personal data we hold about you. This does not include any data we are obliged to keep for administrative, legal, or security purposes."
  - title: "Where your data is sent"
    paragraphs:
      - "Visitor comments may be checked through an automated spam detection service."
  - title: "How can we be contacted"
    paragraphs:
      - "If you have any questions or concerns about your personal data or any other privacy topic, please do no hesitate to contact us on [info@securepay.ae](mailto:info@securepay.ae)."
